<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>회원가입 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">

    <h1 class="auth-brand">Typoem</h1>
    <p class="auth-subtitle">매일 영어 시와 책을 함께 읽어요.</p>

    <div id="errorBox" class="auth-error hidden"></div>

    <form class="auth-form" id="registerForm" novalidate>

      <div class="field">
        <label for="username">아이디</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="영문, 숫자, 밑줄(_) 3~20자"
          required
          autocomplete="username"
        >
        <span class="hint">3~20자의 영문, 숫자, 밑줄(_)</span>
      </div>

      <div class="field">
        <label for="nickname">닉네임</label>
        <input
          id="nickname"
          name="nickname"
          type="text"
          placeholder="함께 읽는 멤버에게 보이는 이름"
          required
          autocomplete="nickname"
        >
        <span class="hint">2~20자 (띄어쓰기 제외)</span>
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="••••••••"
          required
          autocomplete="new-password"
        >
        <span class="hint">8자 이상 (띄어쓰기 제외)</span>
      </div>

      <div class="field">
        <label for="confirmPassword">비밀번호 확인</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="••••••••"
          required
          autocomplete="new-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="auth-submit">가입하기</button>

    </form>

    <p class="auth-footer">
      이미 계정이 있나요? <a href="login.html">로그인</a>
    </p>

  </div>

  <script src="auth.js"></script>
  <script src="register.js"></script>

</body>
</html>
