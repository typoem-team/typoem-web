<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>방 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="rooms">

  <header class="app-head">
    <a href="/index.html" class="app-brand">Typoem</a>
    <p class="app-date" id="today"></p>
  </header>

  <!-- 방 탭: 내 방 전체 (마지막에 연 방이 맨 앞). 카드를 누르면 그 방의 시 탭으로 바로 가요. -->
  <main class="page">
    <div class="page-headline">
      <h1>방 <span class="count" id="rooms-count"></span></h1>
    </div>

    <p id="status" class="status" role="status"></p>

    <nav id="rooms-list" class="room-cards" aria-label="내 방"></nav>

    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-lead">아직 방이 없어요</p>
      <p class="empty-sub">방을 만들거나, 친구에게 받은 코드로 참여해요</p>
    </div>

    <div class="room-actions">
      <a href="/join.html" class="btn btn-ghost">코드로 참여</a>
      <a href="/create-room.html" class="btn">새 방 만들기</a>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="rooms.js"></script>

</body>
</html>
