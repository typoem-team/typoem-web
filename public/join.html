<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>초대 코드로 참여 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">

    <h1 class="card-title">초대 코드로 참여</h1>
    <p class="auth-subtitle">친구에게 받은 초대 코드를 넣어 주세요.</p>

    <div id="errorBox" class="auth-error hidden" role="alert"></div>

    <form class="auth-form" id="joinForm" novalidate>

      <div class="field">
        <label for="invite_code">초대 코드</label>
        <input
          id="invite_code"
          name="invite_code"
          type="text"
          class="code-input"
          placeholder="ABC234"
          required
          minlength="6"
          maxlength="6"
          pattern="[A-HJ-KM-NP-Z2-9]{6}"
          autocomplete="off"
          autocapitalize="characters"
        >
      </div>

      <button type="submit" id="submitBtn" class="auth-submit">참여</button>

    </form>

    <p class="auth-footer">
      <a href="index.html" id="backLink">&larr; 돌아가기</a>
    </p>

  </div>

  <script src="auth.js"></script>
  <script src="join.js"></script>

</body>
</html>
