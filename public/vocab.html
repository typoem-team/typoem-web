<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>단어장 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body data-tab="vocab">

  <header class="app-head">
    <a href="/index.html" class="app-brand">Typoem</a>
    <p class="app-date" id="today"></p>
  </header>

  <main class="page">
    <div class="page-headline vocab-head">
      <h1>단어장</h1>
      <div class="r-tabs" id="vocab-sort" role="group" aria-label="단어 정렬 방식" hidden>
        <button type="button" data-sort="recent" aria-pressed="true">최근 저장순</button>
        <button type="button" data-sort="az" aria-pressed="false">A–Z</button>
      </div>
    </div>

    <p id="status" class="status" role="status"></p>

    <section id="vocab-list" class="vocab-list" aria-live="polite"></section>

    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-lead">아직 저장한 단어가 없어요</p>
      <p class="empty-sub">시나 책을 읽다 모르는 단어를 두 번 누르면 뜻을 보고 단어장에 담아 둘 수 있어요.</p>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="tour.js"></script>
  <script src="vocab.js"></script>

</body>
</html>
