<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading &middot; Typoem</title>

  <!-- Google Fonts (same set as the other pages) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="book-page">

  <!-- Top bar: back to room, title, contents + goal toggles, progress + pace -->
  <header class="book-bar">
    <div class="book-bar-row">
      <a id="book-back" class="book-back" href="/index.html">&larr; Room</a>
      <span id="book-title" class="book-bar-title">&hellip;</span>
      <span class="book-bar-actions">
        <button type="button" id="book-toc-btn" class="btn-sm" aria-expanded="false" disabled>Contents</button>
        <button type="button" id="book-goal-btn" class="btn-sm" aria-expanded="false" disabled>Goal</button>
      </span>
    </div>
    <div class="book-bar-row book-bar-stats">
      <span id="book-progress-text" class="book-progress-text"></span>
      <span id="book-pace" class="book-pace"></span>
    </div>
    <div class="book-progress-track" aria-hidden="true"><div id="book-progress-fill" class="book-progress-fill"></div></div>

    <!-- Contents panel -->
    <nav id="book-toc" class="book-panel" aria-label="Contents" hidden>
      <ol id="book-toc-list" class="book-toc-list"></ol>
    </nav>

    <!-- Goal panel -->
    <div id="book-goal" class="book-panel" hidden>
      <label class="book-goal-row">
        <span>Finish by</span>
        <input type="date" id="book-goal-input">
      </label>
      <button type="button" id="book-goal-clear" class="link-btn">Clear goal</button>
      <p id="book-goal-status" class="book-goal-status" role="status"></p>
    </div>
  </header>

  <!-- Message (loading, not a member, no book, ...) -->
  <div id="book-message" class="book-message" role="status">Loading&hellip;</div>

  <!-- Reader: text flows into one-screen-wide columns; pages move with translateX -->
  <main id="book-stage" class="book-stage" hidden>
    <div id="book-viewport" class="book-viewport">
      <div id="book-flow" class="book-flow"></div>
    </div>
    <!-- Page-turn zones: outer ~15% on each side, so the middle stays free for word taps -->
    <button type="button" id="book-edge-prev" class="book-edge book-edge-prev" aria-label="Previous page"></button>
    <button type="button" id="book-edge-next" class="book-edge book-edge-next" aria-label="Next page"></button>
  </main>

  <footer id="book-foot" class="book-foot" hidden>
    <button type="button" id="book-prev" class="link-btn book-foot-nav" aria-label="Previous page">&lsaquo;</button>
    <span class="book-foot-text">
      <span id="book-chapter-name" class="book-chapter-name"></span>
      <span id="book-page-num" class="book-page-num"></span>
    </span>
    <button type="button" id="book-next" class="link-btn book-foot-nav" aria-label="Next page">&rsaquo;</button>
  </footer>

  <script src="auth.js"></script>
  <script src="book.js"></script>
  <script src="dict-popup.js"></script>

</body>
</html>
