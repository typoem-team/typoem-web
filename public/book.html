<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>책 읽기 &middot; Typoem</title>

  <!-- Fonts are self-hosted: see the @font-face rules at the top of styles.css -->
  <link rel="stylesheet" href="styles.css">
  <!-- 시 | 책: room.html and book.html both opt in, so switching tabs cross-fades
       (the top bar and the selected tab stay in place). Other pages don't. -->
  <style>
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  </style>
</head>
<body class="book-page">

  <!-- room header (back · room name · 시 | 책), drawn by ui.js; the same one is on room.html -->
  <div class="r-bar" data-room-bar="book"></div>

  <!-- ===== Shelf: the room has no book yet, or the owner is changing it ===== -->
  <div id="book-shelf-view" class="book-shelf-view" hidden>
    <header class="r-head">
      <h1 class="c-title" id="book-shelf-title">이 방의 책</h1>
      <p class="c-author" id="book-shelf-lead"></p>
    </header>
    <div class="book-shelf-wrap">
      <p id="book-shelf-status" class="status" role="status"></p>
      <!-- Rows open in place (no sheets): a book's row -> "이 책으로 정하기";
           the owner's empty slot at the end ("책 추가") -> search, and a found book is put on the shelf -->
      <ol id="book-shelf" class="book-shelf" aria-label="책장"></ol>
      <div id="book-shelf-foot" class="book-shelf-foot" hidden>
        <button type="button" class="link-btn" id="book-shelf-back">돌아가기</button>
      </div>
    </div>
  </div>

  <!-- ===== Reader ===== -->
  <!-- Book bar: title + 목차 (책 바꾸기 for the owner sits at the end of the 목차 sheet);
       progress + pace. The pace opens the date picker for the goal date. -->
  <header class="book-bar" id="book-bar" hidden>
    <div class="book-bar-row">
      <div class="book-bar-head">
        <span id="book-title" class="book-bar-title" lang="en">&hellip;</span>
      </div>
      <button type="button" id="book-toc-btn" class="book-btn book-bar-btn" aria-expanded="false" aria-controls="book-toc" disabled>목차</button>
    </div>
    <div class="book-bar-stats">
      <span id="book-progress-text" class="book-progress-text"></span>
      <span class="book-goal">
        <button type="button" id="book-pace" class="book-btn book-pace" aria-label="완독 목표일 정하기" disabled></button>
        <input type="date" id="book-goal-input" class="book-goal-input" tabindex="-1" aria-hidden="true">
      </span>
    </div>
    <div class="book-progress-track" aria-hidden="true"><div id="book-progress-fill" class="book-progress-fill"></div></div>
  </header>

  <!-- Message (loading, not a member, no book, ...) -->
  <div id="book-message" class="book-message" role="status"><p class="book-note">불러오는 중이에요&hellip;</p></div>

  <!-- Reader: text flows into one-screen-wide columns; pages move with translateX -->
  <main id="book-stage" class="book-stage" hidden>
    <div id="book-viewport" class="book-viewport">
      <div id="book-flow" class="book-flow" lang="en"></div>
    </div>
    <!-- Page-turn zones: outer ~15% on each side, so the middle stays free for word taps -->
    <button type="button" id="book-edge-prev" class="book-btn book-edge book-edge-prev" aria-label="이전 쪽"></button>
    <button type="button" id="book-edge-next" class="book-btn book-edge book-edge-next" aria-label="다음 쪽"></button>
  </main>

  <footer id="book-foot" class="book-foot" hidden>
    <button type="button" id="book-prev" class="book-btn book-foot-nav" aria-label="이전 쪽">
      <svg class="book-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="book-foot-text">
      <span id="book-chapter-name" class="book-chapter-name" lang="en"></span>
      <span id="book-page-num" class="book-page-num"></span>
    </span>
    <button type="button" id="book-next" class="book-btn book-foot-nav" aria-label="다음 쪽">
      <svg class="book-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </footer>

  <!-- Bottom sheets -->
  <div id="book-scrim" class="book-scrim" hidden></div>

  <section id="book-toc" class="book-sheet" role="dialog" aria-label="목차" hidden>
    <span class="book-handle" aria-hidden="true"></span>
    <p class="book-sheet-title">목차 <span id="book-toc-count"></span></p>
    <ol id="book-toc-list" class="book-toc-list" lang="en"></ol>
    <div class="book-toc-foot" id="book-toc-foot" hidden>
      <button type="button" id="book-change-btn" class="book-btn book-btn-sec">책 바꾸기</button>
    </div>
  </section>

  <script src="auth.js"></script>
  <!-- ui.js first: book.js uses TypoemUI (toast); dict-popup.js opens the dictionary through it -->
  <script src="ui.js"></script>
  <!-- marks.js before book.js: book.js attaches the highlight / note selection to the text -->
  <script src="marks.js"></script>
  <script src="book.js"></script>
  <script src="dict-popup.js"></script>

</body>
</html>
