<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2eee7">
  <title>Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="today">

  <header class="app-head">
    <h1 class="app-brand">Typoem</h1>
    <p class="app-date" id="today"></p>
  </header>

  <!-- ===== 홈: 위는 스트릭, 아래는 내 방 카드 (마지막에 연 방이 맨 앞) ===== -->
  <main class="page home" id="home">

    <!-- 스트릭 자리: 생김새와 동작은 8단계(경윤). 스트릭 API가 없으면(404) streak.js가 숨겨요 -->
    <section class="home-streak" aria-label="읽은 날" data-streak hidden>
      <div class="streak" data-streak hidden>
        <div class="ring" id="streak-ring" role="img">
          <svg viewBox="0 0 52 52" aria-hidden="true"><circle class="track" cx="26" cy="26" r="23"/><circle class="bar" id="streak-bar" cx="26" cy="26" r="23"/></svg>
          <b id="streak-count"></b>
        </div>
        <p class="ring-cap">일 연속</p>
      </div>
      <div class="week" id="streak-week" aria-label="이번 주 읽은 날" data-streak hidden></div>
    </section>

    <p id="status" class="status" role="status"></p>

    <nav id="rooms-list" class="room-cards" aria-label="내 방"></nav>

    <!-- 방이 없을 때 -->
    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-lead">아직 방이 없어요</p>
      <div class="actions">
        <a href="/create-room.html" class="btn">방 만들기</a>
        <a href="/join.html" class="btn btn-ghost">코드로 참여</a>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="streak.js"></script>
  <script src="rooms.js"></script>
  <script src="index.js"></script>

</body>
</html>
