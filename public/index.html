<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="today">

  <header class="app-head">
    <h1 class="app-brand">Typoem</h1>
    <p class="app-date" id="today"></p>
  </header>

  <!-- ===== 홈: 위는 스트릭, 아래는 최근 방 카드 3개 (마지막에 연 방이 맨 앞) ===== -->
  <main class="page home" id="home">

    <!-- 스트릭: 이번 주 7일 (streak.js, 시안 C). 스트릭 API가 안 되면 streak.js가 숨겨요 -->
    <section class="streak-slot sw" aria-labelledby="streak-week-label" data-streak hidden>
      <div class="sw-head">
        <span class="sw-label" id="streak-week-label">이번 주</span>
        <span class="sw-sum" id="streak-summary"></span>
      </div>
      <div class="sw-days" id="streak-week"></div>
    </section>

    <p id="status" class="status" role="status"></p>

    <!-- 최근에 연 방 3개까지. 전부는 방 탭(rooms.html)에서 봐요 -->
    <nav id="rooms-list" class="room-cards" aria-label="최근 방" data-limit="3"></nav>
    <a href="/rooms.html" class="link-btn all-rooms" id="all-rooms" hidden></a>

    <!-- 방이 없을 때 -->
    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-lead">아직 방이 없어요</p>
      <div class="actions">
        <a href="/create-room.html" class="btn">방 만들기</a>
        <a href="/join.html" class="btn btn-ghost">코드로 참여</a>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="streak.js"></script>
  <script src="rooms.js"></script>
  <script src="index.js"></script>

</body>
</html>
