<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2eee7">
  <title>Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="rooms">

  <header class="app-head">
    <a href="/index.html" class="app-brand">Typoem</a>
    <p class="app-date" id="today"></p>
  </header>

  <main class="page">
    <div class="page-headline">
      <h1>내 방</h1>
    </div>

    <p id="status" class="status" role="status"></p>

    <section id="rooms-grid" class="rooms-grid" aria-live="polite"></section>

    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-lead">아직 방이 없어요</p>
    </div>

    <div class="actions">
      <a href="/create-room.html" class="btn">방 만들기</a>
      <a href="/join.html" class="btn btn-ghost">코드로 참여</a>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="index.js"></script>

</body>
</html>
