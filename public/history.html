<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2eee7">
  <title>지난 시 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="today">

  <header class="app-head">
    <a href="/index.html" class="app-brand">Typoem</a>
    <p class="app-date" id="today"></p>
  </header>

  <!-- Room sub-nav: room name left, room links right -->
  <nav class="room-subnav" aria-label="방">
    <span class="room-name" id="room-name">&hellip;</span>
    <div class="room-subnav-links">
      <a id="back-to-room" href="/index.html">오늘의 시</a>
      <span class="sep">&middot;</span>
      <a href="#" class="is-active" aria-current="page">지난 시</a>
    </div>
  </nav>

  <main class="page">
    <div class="page-headline">
      <h1 id="page-title">지난 시</h1>
    </div>

    <p id="status" class="status" role="status"></p>

    <section id="history-list" class="history-list" aria-live="polite"></section>

    <div id="history-empty" class="empty-state" hidden>
      <p class="empty-lead">아직 읽은 시가 없어요</p>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="history.js"></script>

</body>
</html>
