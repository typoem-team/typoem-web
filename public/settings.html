<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>설정 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body data-tab="me">

  <header class="app-head">
    <a href="/index.html" class="app-brand">Typoem</a>
    <p class="app-date" id="today"></p>
  </header>

  <!-- 설정: 프로필 · 닉네임(아이디) · 테마(라이트 · 다크 · 기기 설정) · 아침 알림(앱) · 정보(출처 · 버전) · 계정(개인정보처리방침, 로그아웃, 계정 삭제) -->
  <main class="page">
    <div class="page-headline">
      <a href="/me.html" class="link-btn back-link">&larr; 나</a>
      <h1>설정</h1>
    </div>

    <!-- 프로필 (11/13: 홈 아바타 팝오버 대신 여기). 함께한 날 = 가입한 날이 1일째 (한국 날짜) -->
    <section class="me-box set-profile" aria-label="프로필">
      <span class="set-prof-av" id="prof-av"></span>
      <p class="set-prof-nick" id="prof-nick"></p>
      <dl class="set-prof-stats">
        <div><dt>함께한 날</dt><dd id="prof-days">–</dd></div>
        <div><dt>참여한 방</dt><dd id="prof-rooms">–</dd></div>
      </dl>
    </section>

    <h2 class="me-h">닉네임</h2>
    <form class="me-box set-form" id="nick-form" novalidate>
      <label for="nick-input">다른 사람에게 보이는 이름이에요 (2–20자, 띄어쓰기 없이)</label>
      <div class="set-row">
        <input class="field" id="nick-input" maxlength="20" autocomplete="nickname" required>
        <button type="submit" class="btn-sm" id="nick-save">바꾸기</button>
      </div>
      <p class="me-username" id="nick-id"></p>
    </form>

    <!-- 테마: theme.js가 [data-theme-choice] 버튼을 이어요. 이 기기에만 저장돼요 -->
    <h2 class="me-h" id="theme-h">화면</h2>
    <div class="me-box set-theme">
      <span class="set-theme-label">테마</span>
      <div class="r-tabs theme-tabs" role="radiogroup" aria-labelledby="theme-h">
        <button type="button" role="radio" data-theme-choice="light" aria-checked="true">라이트</button>
        <button type="button" role="radio" data-theme-choice="dark" aria-checked="false">다크</button>
        <button type="button" role="radio" data-theme-choice="system" aria-checked="false">기기 설정</button>
      </div>
    </div>

    <!-- 아침 알림: 앱 안에서만 보여요 (notify.js, 폰 안에서 예약 — 서버를 안 써요) -->
    <section id="notify-section" hidden>
      <h2 class="me-h" id="notify-h">알림</h2>
      <div class="me-box set-form">
        <label class="set-toggle">
          <span>아침에 오늘의 시 알림</span>
          <input type="checkbox" id="notify-on" role="switch">
        </label>
        <div class="set-row set-time" id="notify-time-row" hidden>
          <label for="notify-time">시간</label>
          <input class="field" type="time" id="notify-time" value="08:00" step="300">
        </div>
      </div>
    </section>

    <h2 class="me-h">정보</h2>
    <div class="me-box">
      <details class="s-row set-credits">
        <summary>출처 및 라이선스</summary>
        <dl>
          <dt>뜻</dt><dd>위키낱말사전 (CC BY-SA 4.0)</dd>
          <dt>시 · 책</dt><dd>퍼블릭 도메인 (Project Gutenberg, PoetryDB)</dd>
          <dt>글꼴</dt><dd>SIL Open Font License</dd>
        </dl>
      </details>
      <button type="button" class="s-row" id="tour-reset">화면 안내 다시 보기</button>
      <div class="s-row set-version">버전 <span>1.0</span></div>
    </div>

    <h2 class="me-h">계정</h2>
    <div class="me-box">
      <a class="s-row" href="/privacy.html">개인정보처리방침</a>
      <button type="button" class="s-row quiet" id="logout-btn">로그아웃</button>
      <button type="button" class="s-row quiet" id="delete-open" aria-expanded="false" aria-controls="delete-form">계정 삭제</button>
    </div>

    <!-- 계정 삭제: 비밀번호를 한 번 더 받아요 (DELETE /api/users/me) -->
    <form class="me-box set-form set-danger" id="delete-form" novalidate hidden>
      <p class="set-note">내 메모, 주석, 형광펜, 단어장, 읽은 기록이 모두 지워지고 되돌릴 수 없어요. 내가 만든 방은 가장 먼저 들어온 멤버에게 넘어가고, 혼자 있는 방은 지워져요.</p>
      <label for="delete-password">비밀번호</label>
      <div class="set-row">
        <input class="field" id="delete-password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn-sm btn-danger" id="delete-btn">삭제</button>
      </div>
    </form>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="tour.js"></script>
  <script src="settings.js"></script>
  <script src="notify.js"></script>

</body>
</html>
