<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b3a36">
  <title>오늘의 시 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <!-- 시 | 책: room.html and book.html both opt in, so switching tabs cross-fades
       (the top bar and the selected tab stay in place). Other pages don't. -->
  <style>
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  </style>
</head>
<body class="reader-page">

  <!-- ===== 읽기 화면 ===== -->
  <article class="reader" id="reader" aria-label="시 읽기">
    <div class="r-bar">
      <a href="/index.html" class="r-back" id="back" aria-label="뒤로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span id="room-name"></span>
      <!-- 시 | 책: the same two tabs sit here on book.html too -->
      <nav class="r-tabs" aria-label="시와 책">
        <a id="tab-poem" href="#" aria-current="page">시</a>
        <a id="tab-book" href="/book.html">책</a>
      </nav>
    </div>

    <!-- 표지 색 띠 + 제목 · 작가 -->
    <header class="r-head" id="r-head">
      <h1 class="c-title" id="poem-title"></h1>
      <p class="c-author" id="poem-author"></p>
    </header>

    <!-- 좁은 화면: 본문 한 칸, 메모는 시트.
         1024px 이상: 본문(최대 640px) + 항상 열려 있는 메모 패널(380px). -->
    <div class="r-cols">
      <div class="r-main">
        <div class="r-body" id="r-body">
          <p class="r-meta" id="r-meta"></p>
          <p id="status" class="status" role="status"></p>
          <div class="poem" id="poem-body"></div>
        </div>

        <!-- "다 읽었어요": 스트릭 API가 없으면(404) 숨겨요 -->
        <div class="r-end" id="r-end" hidden>
          <p>오늘의 시를 끝까지 읽었다면</p>
          <button type="button" class="finish" id="finish">다 읽었어요</button>
        </div>
      </div>

      <!-- 메모: 시트 / 대화상자 / (1024px+) 옆 패널. 패널에서는 둘 중 하나만 보여요. -->
      <aside class="r-side" id="r-side" aria-label="메모">
        <section class="sheet" id="sheet-memo" role="dialog" aria-label="메모" data-wide="inline">
          <span class="handle"></span>
          <p class="s-title">메모 <span id="m-count"></span></p>
          <div id="memo-list" aria-live="polite"></div>
          <form class="m-write" id="memo-form" novalidate>
            <input id="memo-input" class="field" placeholder="이 시에 메모 남기기" aria-label="이 시에 메모 남기기" maxlength="1000" autocomplete="off">
            <button type="submit" class="pri" id="memo-submit">남기기</button>
          </form>
        </section>

        <section class="sheet" id="sheet-line" role="dialog" aria-label="이 줄의 메모" data-wide="inline">
          <span class="handle"></span>
          <button type="button" class="panel-back" id="l-back">&larr; 전체 메모로</button>
          <p class="s-title">이 줄의 메모 <span id="l-count"></span></p>
          <p class="d-ex" id="drawer-line"></p>
          <button type="button" class="sec line-btn" id="l-mark">밑줄 긋기</button>
          <div id="annotation-list" aria-live="polite"></div>
          <form class="m-write" id="annotation-form" novalidate>
            <input id="annotation-input" class="field" placeholder="이 줄에 메모 남기기" aria-label="이 줄에 메모 남기기" maxlength="1000" autocomplete="off">
            <button type="submit" class="pri" id="annotation-submit">남기기</button>
          </form>
          <button type="button" class="sec line-btn" id="l-edit-mine" hidden>내 메모 고치기</button>
        </section>
      </aside>
    </div>
  </article>

  <!-- 떠 있는 "메모 N" 알약 (1024px 이상에서는 패널이 있어서 숨겨요) -->
  <button type="button" class="memo-pill" id="memo-pill" aria-haspopup="dialog" hidden>
    <span class="avs" id="pill-avs"></span><span id="pill-label"></span>
  </button>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="streak.js"></script>
  <script src="room.js"></script>
  <script src="dict-popup.js"></script>

</body>
</html>
