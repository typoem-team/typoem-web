<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2eee7">
  <title>오늘의 시 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="today">

  <header class="app-head">
    <a href="/index.html" class="app-brand">Typoem</a>
    <p class="app-date" id="today"></p>
  </header>

  <!-- Room sub-nav: room name left, room links right -->
  <nav class="room-subnav" aria-label="방">
    <a class="room-name room-back" href="/index.html" aria-label="홈으로"><span aria-hidden="true">&larr;</span> <span id="room-name">&hellip;</span></a>
    <div class="room-subnav-links">
      <a href="#" class="is-active" aria-current="page">오늘의 시</a>
      <span class="sep">&middot;</span>
      <a id="history-link" href="/index.html">지난 시</a>
    </div>
  </nav>

  <main class="page">

    <p id="status" class="status" role="status"></p>

    <div class="poem-layout">

      <!-- Today's poem -->
      <section class="poem-column" aria-label="오늘의 시">
        <article class="poem-sheet">
          <h2 class="poem-title" id="poem-title"></h2>
          <p class="poem-author" id="poem-author"></p>
          <div class="rule-thin"></div>
          <div class="poem-body" id="poem-body"></div>
        </article>
      </section>

      <!-- Memos (full-poem notes) -->
      <aside class="memo-column" aria-label="메모">
        <h2 class="panel-heading">메모</h2>

        <div class="memo-compose">
          <textarea id="memo-input" class="note-input" rows="3"
            placeholder="이 시에 메모 남기기" aria-label="이 시에 메모 남기기" maxlength="1000"></textarea>
          <p id="memo-error" class="auth-error" role="alert"></p>
          <button type="button" id="memo-submit" class="btn">남기기</button>
        </div>

        <p id="memo-empty" class="empty-sub" hidden>아직 남긴 메모가 없어요.</p>
        <div id="memo-list" class="note-list" aria-live="polite"></div>
      </aside>

    </div>

    <!-- This room's book (v1.1, temporary UI) — filled in by the book section of room.js -->
    <section class="book-entry" id="book-entry" aria-label="이 방의 책" lang="ko" hidden>
      <h4 class="book-label">이 방의 책</h4>
      <div id="book-entry-body"></div>
      <div id="book-picker" class="book-picker" hidden></div>
    </section>

  </main>

  <!-- Annotation drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="drawer" class="drawer" role="dialog" aria-label="이 줄의 메모">
    <div class="drawer-head">
      <h2 class="panel-heading">이 줄의 메모</h2>
      <button type="button" id="drawer-close" class="link-btn">닫기</button>
    </div>

    <blockquote class="drawer-line" id="drawer-line"></blockquote>

    <div class="memo-compose">
      <textarea id="annotation-input" class="note-input" rows="3"
        placeholder="이 줄에 메모 남기기" aria-label="이 줄에 메모 남기기" maxlength="1000"></textarea>
      <p id="annotation-error" class="auth-error" role="alert"></p>
      <button type="button" id="annotation-submit" class="btn">남기기</button>
    </div>

    <p id="annotation-empty" class="empty-sub" hidden>아직 이 줄에 남긴 메모가 없어요.</p>
    <div id="annotation-list" class="note-list" aria-live="polite"></div>
  </aside>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="room.js"></script>
  <script src="dict-popup.js"></script>

</body>
</html>
