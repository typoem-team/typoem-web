<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>나 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body data-tab="me">

  <header class="app-head">
    <a href="/index.html" class="app-brand">Typoem</a>
    <p class="app-date" id="today"></p>
  </header>

  <!-- 나 탭: 내 기록(스트릭) · 친구 기록 · 배지 · 설정 링크 -->
  <main class="page">
    <div class="page-headline">
      <h1 id="me-nick"></h1>
      <p class="me-username" id="me-username"></p>
    </div>

    <!-- ≥1024px: 왼쪽 달력 | 오른쪽 친구 기록 · 배지 · 설정. 그보다 좁으면 위에서 아래로 쌓여요 -->
    <div class="me-cols">
    <!-- 스트릭: 큰 숫자 + 이번 달 달력 (streak.js, 시안 C). 스트릭 API가 안 되면 streak.js가 숨겨요 -->
    <section class="streak-slot sm" aria-label="읽은 날" data-streak hidden>
      <div class="sm-hero">
        <b class="sm-num" id="streak-count"></b>
        <div class="sm-text">
          <p class="sm-cap" aria-hidden="true">일째 이어 읽는 중</p>
          <p class="sm-sub" id="streak-sub"></p>
        </div>
      </div>
      <div class="sm-month" id="streak-month"></div>
    </section>

    <div class="me-side">
    <h2 class="me-h">친구 기록</h2>
    <p id="status" class="status" role="status"></p>
    <div id="friends"></div>

    <!-- 배지 (me.js, GET /api/users/me/badges). 불러오지 못하면 영역째 숨겨요 -->
    <section aria-labelledby="badges-h" id="badges-box" hidden>
      <h2 class="me-h" id="badges-h">배지 <span class="badge-count" id="badges-count"></span></h2>
      <ul class="badge-grid" id="badges"></ul>
    </section>

    <div class="me-box me-account">
      <a class="s-row" href="/settings.html">설정 <span class="s-row-sub">닉네임 · 로그아웃 · 계정 삭제</span></a>
    </div>
    </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
  <script src="streak.js"></script>
  <script src="me.js"></script>

</body>
</html>
