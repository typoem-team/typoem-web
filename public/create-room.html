<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>새 방 만들기 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">

    <h1 class="card-title">새 방 만들기</h1>
    <p class="auth-subtitle">매일 시 한 편을 같이 읽을 방이에요.</p>

    <div id="errorBox" class="auth-error hidden" role="alert"></div>

    <!-- Create form -->
    <form class="auth-form" id="createForm" novalidate>

      <div class="field">
        <label for="name">방 이름</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="예: 우리 셋의 시집"
          required
          minlength="1"
          maxlength="50"
          autocomplete="off"
        >
      </div>

      <div class="field">
        <label for="description">소개 (선택)</label>
        <textarea
          id="description"
          name="description"
          placeholder="어떤 방인가요?"
          maxlength="200"
          rows="3"
        ></textarea>
      </div>

      <button type="submit" id="submitBtn" class="auth-submit">방 만들기</button>

    </form>

    <!-- Back link -->
    <p class="auth-footer">
      <a href="index.html" id="backLink">&larr; 돌아가기</a>
    </p>

  </div>

  <script src="auth.js"></script>
  <script src="create-room.js"></script>

</body>
</html>
