<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>로그인 · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">

    <h1 class="auth-brand">Typoem</h1>
    <p class="auth-subtitle">다시 만나서 반가워요.</p>

    <div id="errorBox" class="auth-error hidden"></div>

    <form class="auth-form" id="loginForm" novalidate>

      <div class="field">
        <label for="username">아이디</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="아이디를 입력해 주세요"
          required
          autocomplete="username"
        >
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="auth-submit">로그인</button>

    </form>

    <p class="auth-footer">
      아직 계정이 없나요? <a href="register.html">회원가입</a>
    </p>

  </div>

  <script src="auth.js"></script>
  <script src="login.js"></script>

</body>
</html>
