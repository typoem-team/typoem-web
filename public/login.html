<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2eee7">
  <title>Log In · Typoem</title>

  <!-- App stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">

    <h1 class="auth-brand">Typoem</h1>
    <p class="auth-subtitle">Welcome back.</p>

    <div id="errorBox" class="auth-error hidden"></div>

    <form class="auth-form" id="loginForm" novalidate>

      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Enter your username"
          required
          autocomplete="username"
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="auth-submit">Log In</button>

    </form>

    <p class="auth-footer">
      No account yet? <a href="register.html">Sign up</a>
    </p>

  </div>

  <script src="auth.js"></script>
  <script src="login.js"></script>

</body>
</html>
