<!DOCTYPE html>
<html lang="ko">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Typoem · 함께 읽는 영어 시와 책</title>

  <link rel="stylesheet" href="styles.css">

<body class="landing-page" hidden>

  <main class="landing">
    <div class="landing-headline">
      <h1 class="auth-brand">Typoem</h1>
      <p class="auth-subtitle">매일 영어 시 한 편, 친구들과 조용히.</p>
      <p class="landing-tagline">우리끼리의 방에서 매일 영어 시 한 편과 책 한 권을 함께 읽어요. 메모를 남기고, 모르는 단어는 같이 찾아봐요.</p>

    <p id="status" class="status" role="status">오늘의 시를 불러오는 중이에요…</p>

    <div class="landing-cta">
      <p class="landing-invite">친구들과 함께 읽어 보세요.</p>
      <a href="/register.html" class="btn">회원가입</a>
      <p class="auth-footer">이미 계정이 있나요? <a href="/login.html">로그인</a></p>
    </div>
