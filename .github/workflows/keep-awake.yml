name: keep-awake

# Render's free plan sleeps after 15 minutes without traffic, and waking takes ~1 minute.
# Ping the health route every 10 minutes so store reviewers never hit a cold start.
# shortcut: GitHub may delay scheduled runs by several minutes; use cron-job.org or UptimeRobot if it still sleeps.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://typoem-app.onrender.com/api/health
