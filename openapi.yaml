    get:
      tags: [Poems]
      summary: Get today's poem with its memos and line annotations
      description: >
        Returns the room's poem of the day plus its full-poem memos and line
        annotations. If no poem is assigned yet, a fresh (room-unseen) poem is
        fetched live from PoetryDB (falling back to a local pool), cached, and
        assigned for today. This is the only endpoint that assigns a daily poem.
        Opening it also checks the user in for today's streak, unless checkin=0.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: checkin
          in: query
          required: false
          description: "0 = return the poem without a streak check-in (the home cover). Default: check in."
          schema:
            type: string
            enum: ['0', '1']
      responses:
        '200':
          description: Today's poem with memos and annotations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayPoem'
        '400':
          description: Invalid room id
          content:
