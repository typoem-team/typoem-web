      tags: [Poem marks]
      summary: Delete my highlight or note
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 9
      responses:
        '204':
          description: Mark deleted
        '400':
          description: Invalid mark id
        '401':
          description: Missing or invalid token
        '403':
          description: Can only delete your own mark
        '404':
