  /api/rooms/{id}/history/{date}:
    get:
      tags: [Rooms]
      summary: Read one past day's poem (read-only)
      description: >
        Same body as /today for the poem the room had on `date` (Korea calendar date),
        plus `readOnly: true`. Never assigns a poem. Members only.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, example: 5 }
        - { name: date, in: path, required: true, schema: { type: string, format: date }, example: '2026-11-02' }
      responses:
        '200': { description: The poem, memos, annotations and poem marks of that day }
        '400': { description: Invalid room id, malformed date, or a future date }
        '401': { description: Missing or invalid token }
        '403': { description: Not a member of this room }
        '404': { description: Room not found, or no poem for that date }
  /api/streak:
    get:
      tags: [Streak]
      summary: My reading streak
      description: >
        Consecutive Korea-calendar days with a check-in. If today is not checked yet,
        a streak that reached yesterday is still counted.
      parameters:
        - name: month
          in: query
          required: false
          description: Also return the days I read in this month (calendar), as `month` and `days`.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          example: '2026-11'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Streak summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreakSummary' }
        '400': { description: month is not YYYY-MM }
        '401': { description: Missing or invalid token }
  /api/streak/checkin:
    post:
      tags: [Streak]
      summary: Mark today as read ("다 읽었어요")
      description: Idempotent — checking in again on the same day changes nothing.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Streak summary after the check-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreakSummary' }
        '401': { description: Missing or invalid token }
  /api/rooms/{id}/streaks:
    get:
      tags: [Streak]
      summary: Every member's reading streak (friends view)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, example: 5 }
      responses:
        '200':
          description: Members in join order with their streaks
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date, example: '2026-11-11' }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 1 }
                        username: { type: string, example: alice }
                        nickname: { type: string, example: Alice }
                        current: { type: integer, example: 3 }
                        longest: { type: integer, example: 5 }
                        checkedInToday: { type: boolean, example: true }
        '400': { description: Invalid room id }
        '401': { description: Missing or invalid token }
        '403': { description: Not a member of this room }
        '404': { description: Room not found }
  /api/rooms/{id}/books/history:
    get:
      tags: [Books]
      summary: Books this room has read (History · 소설 탭)
      description: >
        The room's current book plus every book a member has progress on. Status and
        progress are mine. A book counts as finished when I am on its last paragraph or
        at most max(500 words, 1% of the book) is left (progress is saved per page).
        Current book first, then the one I read most recently. Members only.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, example: 5 }
      responses:
        '200':
          description: Books, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    book_id: { type: integer, example: 158 }
                    title: { type: string, example: Emma }
                    author: { type: string, example: 'Austen, Jane' }
                    is_current: { type: boolean, example: true }
                    status: { type: string, enum: [reading, finished, paused] }
                    progress: { type: integer, example: 42, description: 'My %, 0-100' }
                    last_read_at: { type: string, nullable: true, example: '2026-11-12 10:00:00' }
                    finished_at: { type: string, nullable: true }
                    my_mark_count: { type: integer, example: 3 }
                    readers:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: integer }
                          nickname: { type: string }
                          progress: { type: integer }
                          finished: { type: boolean }
        '400': { description: Invalid room id }
        '401': { description: Missing or invalid token }
        '403': { description: Not a member of this room }
        '404': { description: Room not found }
  /api/users/me/badges:
    get:
      tags: [Users]
      summary: My badges
      description: >
        Computed from stored data. streak_3/7/30 (longest streak), first_memo/memo_10
        (memos + note marks on poems and books), first_book (finished a book).
        progress is capped at goal.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Badges
          content:
            application/json:
              schema:
                type: object
                properties:
                  earned_count: { type: integer, example: 2 }
                  badges:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: streak_7 }
                        name: { type: string, example: 7일 연속 }
                        description: { type: string, example: 7일 연속으로 읽었어요 }
                        earned: { type: boolean, example: false }
                        progress: { type: integer, example: 4 }
                        goal: { type: integer, example: 7 }
        '401': { description: Missing or invalid token }
