  /api/books/search:
    get:
      tags: [Books]
      summary: Search Project Gutenberg
      description: >
        Proxies a Gutendex search (English, plain-text editions, first result page).
        A purely numeric q of 1-7 digits (e.g. "11" or "1984") also looks that
        number up as a Project Gutenberg id in Project Gutenberg's own catalog, at
        the same time as the title search. The id match is listed first, then title
        matches. If the title search is still running 3 s after the id lookup
        finishes, the id result is returned alone, so a book can be found by number
        while Gutendex is down.
        Only books whose authors and translators all died in 1962 or earlier
        (public domain in Korea) are returned.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Title or author words, 1-100 characters.
          schema:
            type: string
          example: pride prejudice
      responses:
        '200':
          description: Matching books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSearchResult'
        '400':
          description: Missing or too long q
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Gutendex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms/{id}/book:
    get:
      tags: [Books]
      summary: Get the room's book (overview or one chapter)
      description: >
        Without `chapter`, returns the book, its chapter list and the caller's
        progress (`paragraphIdx: 0`, `targetEndDate: null` if not started; no row
        is created), sent with `Cache-Control: no-store`.
        With `chapter=N`, returns that chapter's paragraphs in order.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: chapter
          in: query
          required: false
          description: 0-based chapter index.
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        '200':
          description: Overview (no chapter) or one chapter (chapter=N)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RoomBook'
                  - $ref: '#/components/schemas/RoomBookChapter'
        '400':
          description: Invalid room id or chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of this room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found, no book assigned to this room, or chapter out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Books]
      summary: Set the room's book (owner only)
      description: >
        Assigns a Project Gutenberg book to the room, replacing the current one
        (members' progress is kept per book). If the book is not stored yet it is
        fetched from Project Gutenberg (metadata from its RDF catalog file, with
        Gutendex as a fallback), checked (English only, public domain in Korea),
        split into chapters and paragraphs, and stored. Returns 200 whether the book
        was newly imported or already stored.


        Timing: an already stored book responds immediately. A new import usually
        takes a few seconds (about 4 s for Pride and Prejudice locally) but can take
        up to about 60 seconds plus storage time in the worst case: the metadata
        lookup (RDF file and Gutendex in parallel) times out after 15 s and is
        retried once on a timeout or network error (30 s), then the text download
        times out after 30 s.
        Clients should show a loading state and allow at least 70 seconds.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gutenbergId]
              properties:
                gutenbergId:
                  type: integer
                  example: 1342
      responses:
        '200':
          description: The room's book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Invalid room id or gutenbergId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of this room, or not the room owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Only the room owner can change the book
        '404':
          description: Room not found, or no such book on Project Gutenberg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Not an English book, not public domain in Korea, no plain-text edition, over 200,000 words, or under 50 paragraphs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Gutendex or Project Gutenberg unavailable (metadata lookup has a 15 s timeout and is retried once first; text download has a 30 s timeout)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Import was interrupted by a concurrent import; retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms/{id}/book/progress:
    put:
      tags: [Books]
      summary: Save my reading progress for the room's book
      description: >
        Upserts the caller's progress for the room's current book. Omitting
        targetEndDate keeps the stored value; null clears it. Sent with
        `Cache-Control: no-store`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paragraphIdx]
              properties:
                paragraphIdx:
                  type: integer
                  minimum: 0
                  description: Must be less than the book's totalParagraphs.
                  example: 120
                targetEndDate:
                  type: string
                  nullable: true
                  description: A real calendar date (YYYY-MM-DD) or null.
                  example: "2026-12-31"
      responses:
        '200':
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingProgress'
        '400':
          description: Invalid room id, paragraphIdx or targetEndDate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of this room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found, or no book assigned to this room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/rooms/{id}/book/marks:
    get:
      tags: [Books]
      summary: List highlights and notes in one chapter of the room's book
      description: 'Oldest first. Sent with `Cache-Control: no-store`.'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: chapter
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        '200':
          description: Marks in the chapter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookMark'
        '400':
          description: Invalid room id or chapter
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member of this room
        '404':
          description: Room not found, no book assigned, or chapter not found
    post:
      tags: [Books]
      summary: Highlight or annotate a range of the room's book
      description: >
        Both ends must be paragraphs of chapterIdx, and (startPara, startWord)
        must not come after (endPara, endWord). A highlight needs a color
        (yellow, pink, blue, green); its content is ignored and stored as null.
        A note needs content (1-500 characters); its color is ignored and stored
        as null. The same range may be marked more than once.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, chapterIdx, startPara, startWord, endPara, endWord, quote]
              properties:
                kind:
                  type: string
                  enum: [highlight, note]
                color:
                  type: string
                  enum: [yellow, pink, blue, green]
                  description: Required for a highlight; ignored for a note.
                chapterIdx:
                  type: integer
                  minimum: 0
                  example: 0
                startPara:
                  type: integer
                  minimum: 0
                  example: 3
                startWord:
                  type: integer
                  minimum: 0
                  example: 0
                endPara:
                  type: integer
                  minimum: 0
                  example: 3
                endWord:
                  type: integer
                  minimum: 0
                  example: 9
                quote:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: "It is a truth universally acknowledged"
                content:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: "The irony starts in line one."
      responses:
        '201':
          description: Mark created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookMark'
        '400':
          description: Invalid input or range
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member of this room
        '404':
          description: Room not found, or no book assigned to this room
  /api/book-marks/{id}:
    patch:
      tags: [Books]
      summary: Edit my note's content
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: "Edited thought."
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookMark'
        '400':
          description: Invalid id or content, or the mark is a highlight
        '401':
          description: Missing or invalid token
        '403':
          description: Can only edit your own mark
        '404':
          description: Mark not found
    delete:
      tags: [Books]
      summary: Delete my highlight or note
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 7
      responses:
        '204':
          description: Mark deleted
        '400':
          description: Invalid mark id
        '401':
          description: Missing or invalid token
        '403':
          description: Can only delete your own mark
        '404':
          description: Mark not found
  /api/rooms/{id}/poems/{poemId}/marks:
    get:
      tags: [Poem marks]
      summary: List highlights and notes on a poem of the room
      description: >
        Any poem this room has been given (on any date). Oldest first.
        Sent with `Cache-Control: no-store`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: poemId
          in: path
          required: true
          schema:
            type: integer
            example: 30
      responses:
        '200':
          description: Marks on the poem
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoemMark'
        '400':
          description: Invalid room id or poem id
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member of this room
        '404':
          description: Room not found, or the room was never given this poem
    post:
      tags: [Poem marks]
      summary: Highlight or annotate a word range of today's poem
      description: >
        Only the room's poem of today (same UTC date as line annotations).
        Both lines must exist in the poem, and (startLine, startWord) must not
        come after (endLine, endWord). A highlight needs a color; a note needs
        content (1-500 characters). The other field is ignored and stored as null.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: poemId
          in: path
          required: true
          schema:
            type: integer
            example: 30
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, startLine, startWord, endLine, endWord, quote]
              properties:
                kind:
                  type: string
                  enum: [highlight, note]
                color:
                  type: string
                  enum: [yellow, pink, blue, green]
                  description: Required for a highlight; ignored for a note.
                startLine:
                  type: integer
                  minimum: 1
                  example: 2
                startWord:
                  type: integer
                  minimum: 0
                  example: 1
                endLine:
                  type: integer
                  minimum: 1
                  example: 3
                endWord:
                  type: integer
                  minimum: 0
                  example: 0
                quote:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: "the woods are lovely"
                content:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: "dark and deep"
      responses:
        '201':
          description: Mark created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoemMark'
        '400':
          description: Invalid input or range
        '401':
          description: Missing or invalid token
        '403':
          description: Not a member of this room
        '404':
          description: Room not found, or the poem is not this room's poem today
  /api/poem-marks/{id}:
    patch:
      tags: [Poem marks]
      summary: Edit my note's content
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 500
