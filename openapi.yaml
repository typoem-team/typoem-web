openapi: 3.0.3

info:
  title: Typoem API
  description: API for Typoem — a daily poem reading and annotation app for small private rooms.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: User registration and login
  - name: Users
    description: Authenticated user profile
  - name: Rooms
    description: Private rooms with invite codes
  - name: Dictionary
    description: Word definitions (cached proxy of the Free Dictionary API)
  - name: Memos
    description: Memos on a room's poem of the day
  - name: Annotations
    description: Line-level annotations on a room's poem of the day
  - name: Poems
    description: The room's poem of the day with its memos and line annotations
  - name: Public
    description: Unauthenticated endpoints for the landing page
  - name: Vocab
    description: Personal vocabulary notebook
  - name: Books
    description: A Project Gutenberg novel a room reads together, with per-member reading progress

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StreakSummary:
      type: object
      properties:
        current: { type: integer, example: 3, description: Days in a row (Korea calendar) }
        longest: { type: integer, example: 5 }
        checkedInToday: { type: boolean, example: true }
        week:
          type: array
          description: Checked dates in this Mon..Sun week, ascending
          items: { type: string, format: date }
          example: ['2026-11-09', '2026-11-10', '2026-11-11']
        month: { type: string, example: '2026-11', description: Only with ?month= }
        days:
          type: array
          description: Only with ?month= — the days I read in that month, ascending
          items: { type: string, format: date }
          example: ['2026-11-01', '2026-11-09', '2026-11-11']
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: jiseop
        nickname:
          type: string
          example: Jiseop

    Me:
      description: GET /api/users/me — the User fields plus when I joined.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            created_at:
              type: string
              nullable: true
              description: >
                Sign-up time, UTC 'YYYY-MM-DD HH:MM:SS' (the settings profile counts 함께한 날
                from its Korea date). Accounts made before this field existed got their
                earliest activity instead. null when unknown.
              example: '2026-11-02 10:15:00'

    Error:
      type: object
      properties:
        error:
          type: string
          example: "username already exists"
    
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "English Lit Study"
        description:
          type: string
          nullable: true
          example: "Our daily poetry room"
        invite_code:
          type: string
          example: "ABC123"
        owner_id:
          type: integer
          example: 1

    RoomWithCount:
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          properties:
            member_count:
              type: integer
              example: 3
            today_poem_title:
              type: string
              nullable: true
              description: Today's poem (Korea date). null until someone in the room opens today's poem — listing rooms never picks one.
              example: Lights Out
            book_title:
              type: string
              nullable: true
              description: The room's book, null when the room has none.
              example: Pride and Prejudice
            book_progress:
              type: integer
              nullable: true
              minimum: 0
              maximum: 100
              description: My progress in the room's book, % of words before my saved paragraph (rounded down). 0 before I open it, null when the room has no book.
              example: 42
            last_opened_at:
              type: string
              nullable: true
              description: 'When I last opened this room''s poem (GET /today, not ?checkin=0) or book (GET /book), UTC "YYYY-MM-DD HH:MM:SS.SSS". null if never.'
              example: '2026-11-13 08:30:12.345'

    RoomMember:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: jiseop
        nickname:
          type: string
          example: Jiseop
        role:
          type: string
          enum: [owner, member]
          example: owner
    HistoryEntry:
      type: object
      properties:
        date:
          type: string
          example: "2026-06-08"
        poem_id:
          type: integer
          example: 3
        title:
          type: string
          example: Now We Are Six
        author:
          type: string
          example: A. A. Milne
        contributor_count:
          type: integer
          example: 2
        contributors:
          type: string
          nullable: true
          description: Comma-separated nicknames of members who left memos, or null if none.
          example: "Soyeon,Jiseop"
          
    WordEntry:
      type: object
      properties:
        word:
          type: string
          example: clever
        phonetic:
          type: string
          nullable: true
          example: "/ˈklɛvə/"
        definitions:
          type: array
          items:
            type: object
            properties:
              partOfSpeech:
                type: string
                example: adjective
              definition:
                type: string
                example: Quick to understand, learn, and devise or apply ideas.
              example:
                type: string
                nullable: true
                example: She is very clever at solving puzzles.
        ko:
          type: array
          description: >
            Korean meanings from the local dictionary file (data/ko_dict.jsonl).
            Empty when the word is not in it. When the English source is down but
            Korean meanings exist, the response is 200 with definitions = [].
          items:
            type: object
            properties:
              pos:
                type: string
                example: 명사
              ko:
                type: array
                items:
                  type: string
                example: ["(문학) 시 (詩)."]
        koFrom:
          type: string
          nullable: true
          description: Base form the Korean meanings were found under (e.g. "be" for "was"); null when the word itself matched.
          example: null
        cached:
          type: boolean
          description: True if the entry was served from word_cache instead of the external API.
          example: true
    VocabEntry:
      type: object
      properties:
        id:
          type: integer
          example: 1
        word:
          type: string
          example: clever
        phonetic:
          type: string
          nullable: true
          example: /ˈklɛvə/
        definition:
          type: string
          example: Quick to understand, learn, and devise or apply ideas.
        created_at:
          type: string
          example: "2026-06-08 09:00:00"
    Memo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 4
        room_id:
          type: integer
          example: 1
        poem_id:
          type: integer
          example: 1
        content:
          type: string
          example: "This poem really moved me today."
        created_at:
          type: string
          example: "2026-05-30 13:20:05"
        author_nickname:
          type: string
          description: Included in list responses (joined from users).
          example: Tester
        like_count:
          type: integer
          description: Total number of likes on this memo.
          example: 3
        liked_by_me:
          type: integer
          description: 1 if the current user has liked this memo, 0 otherwise.
          example: 1
    Annotation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        line_id:
          type: integer
          example: 2
        line_number:
          type: integer
          description: The line's position in the poem (joined from poem_lines).
          example: 2
        room_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 4
        content:
          type: string
          example: "This line is so striking."
        created_at:
          type: string
          example: "2026-05-30 13:20:05"
        author_nickname:
          type: string
          description: Included in responses (joined from users).
          example: Tester


    PoemLine:
      type: object
      properties:
        id:
          type: integer
          example: 21
        line_number:
          type: integer
          example: 1
        text:
          type: string
          description: Empty string for blank lines (stanza breaks).
          example: "When I was One,"

    PublicPoem:
      type: object
      description: >
        A poem in its raw form (lines as plain strings), as returned by the
        public landing endpoint. Unlike Poem, the lines are NOT persisted, so
        they carry no ids - the public taster has no memos or annotations.
      properties:
        title:
          type: string
          example: "Fragment"
        author:
          type: string
          example: "Percy Bysshe Shelley"
        lines:
          type: array
          items:
            type: string
          example:
            - "Wealth, and dominion, fade into the mass"
            - "Of the great sea of human right and wrong,"
            - "When once from our possession they must pass;"
            - "But love, though misdirected, is among"
            - "The things which are immortal, and surpass"

    Poem:
      type: object
      properties:
        id:
          type: integer
          example: 7
        title:
          type: string
          example: "Now We Are Six"
        author:
          type: string
          example: "A. A. Milne"
        linecount:
          type: integer
          description: Number of non-empty lines.
          example: 12
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PoemLine'

    LineAnnotation:
      type: object
      properties:
        id:
          type: integer
          example: 5
        line_id:
          type: integer
          example: 21
        line_number:
          type: integer
          example: 1
        room_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 4
        content:
          type: string
          example: "Striking opening."
        created_at:
          type: string
          example: "2026-05-31 10:05:00"
        author_nickname:
          type: string
          description: Joined from users.
          example: Soyeon

    TodayPoem:
      type: object
      properties:
        room:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "English Lit Study"
        date:
          type: string
          description: UTC date (YYYY-MM-DD) the poem is assigned for.
          example: "2026-05-31"
        poem:
          $ref: '#/components/schemas/Poem'
        memos:
          type: array
          items:
            $ref: '#/components/schemas/Memo'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/LineAnnotation'
        poem_marks:
          type: array
          description: Word-range highlights and notes on this poem in this room, oldest first.
          items:
            $ref: '#/components/schemas/PoemMark'

    Book:
      type: object
      properties:
        id:
          type: integer
          description: Same as gutenbergId.
          example: 1342
        gutenbergId:
          type: integer
          description: Project Gutenberg ebook number.
          example: 1342
        title:
          type: string
          example: "Pride and Prejudice"
        author:
          type: string
          description: Author names joined with "; ".
          example: "Austen, Jane"
        authorDeathYear:
          type: integer
          nullable: true
          description: Death year of the first author.
          example: 1817
        totalWords:
          type: integer
          example: 121581
        totalParagraphs:
          type: integer
          example: 2061

    BookListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1342
        gutenbergId:
          type: integer
          example: 1342
        title:
          type: string
          example: "Pride and Prejudice"
        author:
          type: string
          example: "Austen, Jane"
        totalWords:
          type: integer
          example: 121581

    ShelfBook:
      type: object
      properties:
        gutenbergId:
          type: integer
          example: 1342
        title:
          type: string
          example: "Pride and Prejudice"
        author:
          type: string
          description: Display name (first name first)
          example: "Jane Austen"
        imported:
          type: boolean
          description: Already stored on the server (assigning it is instant)
          example: true

    BookSearchResult:
      type: object
      properties:
        gutenbergId:
          type: integer
          example: 1342
        title:
          type: string
          example: "Pride and Prejudice"
        authors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "Austen, Jane"
              deathYear:
                type: integer
                nullable: true
                example: 1817
        alreadyImported:
          type: boolean
          description: True if the book is already stored, so assigning it is instant.
          example: false

    BookChapter:
      type: object
      properties:
        idx:
          type: integer
          description: 0-based chapter index.
          example: 0
        title:
          type: string
          nullable: true
          description: Heading text; null for books without chapter headings.
          example: "Chapter I."
        startParagraph:
          type: integer
          description: Book-wide index of the chapter's first paragraph.
          example: 0
        paragraphCount:
          type: integer
          example: 25
        wordCount:
          type: integer
          example: 852

    BookParagraph:
      type: object
      properties:
        id:
          type: integer
          description: Stable paragraph id.
          example: 5012
        idx:
          type: integer
          description: 0-based index across the whole book.
          example: 0
        text:
          type: string
          example: "It is a truth universally acknowledged, that a single man in possession of a good fortune must be in want of a wife."

    ReadingProgress:
      type: object
      properties:
        paragraphIdx:
          type: integer
          description: Book-wide paragraph index the reader is at (0 when not started).
          example: 120
        targetEndDate:
          type: string
          nullable: true
          description: Reader's goal date (YYYY-MM-DD). Remaining days are computed on the client.
          example: "2026-12-31"
        startedAt:
          type: string
          nullable: true
          description: When progress was first saved (null when not started).
          example: "2026-11-10 09:12:00"
        updatedAt:
          type: string
          nullable: true
          example: "2026-11-10 09:40:00"

    RoomBook:
      type: object
      properties:
        room:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "English Lit Study"
        book:
          $ref: '#/components/schemas/Book'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/BookChapter'
        progress:
          $ref: '#/components/schemas/ReadingProgress'
        readers:
          type: array
          description: >
            Current room members who have progress on this book in this room
            (the caller included, with isMe true).
          items:
            $ref: '#/components/schemas/BookReader'

    BookReader:
      type: object
      properties:
        userId:
          type: integer
          example: 2
        nickname:
          type: string
          example: "Bob"
        chapterIdx:
          type: integer
          nullable: true
          description: Chapter containing the reader's paragraphIdx (past the end -> last chapter).
          example: 3
        isMe:
          type: boolean
          example: false

    BookMark:
      type: object
      properties:
        id:
          type: integer
          example: 7
        room_id:
          type: integer
          example: 1
        book_id:
          type: integer
          example: 1342
        user_id:
          type: integer
          example: 2
        author_nickname:
          type: string
          example: "Bob"
        kind:
          type: string
          enum: [highlight, note]
        color:
          type: string
          nullable: true
          enum: [yellow, pink, blue, green, null]
          description: Highlight colour; always null for a note.
          example: "yellow"
        chapter_idx:
          type: integer
          example: 0
        start_para:
          type: integer
          description: book_paragraphs.idx of the first paragraph.
          example: 3
        start_word:
          type: integer
          description: 0-based .word span in start_para (inclusive).
          example: 0
        end_para:
          type: integer
          example: 3
        end_word:
          type: integer
          description: 0-based .word span in end_para (inclusive).
          example: 9
        quote:
          type: string
          example: "It is a truth universally acknowledged"
        content:
          type: string
          nullable: true
          description: The note text; always null for a highlight.
          example: "The irony starts in line one."
        created_at:
          type: string
          example: "2026-11-11 09:00:00"

    PoemMark:
      type: object
      properties:
        id:
          type: integer
          example: 9
        room_id:
          type: integer
          example: 1
        poem_id:
          type: integer
          example: 30
        user_id:
          type: integer
          example: 2
        author_nickname:
          type: string
          example: "Bob"
        kind:
          type: string
          enum: [highlight, note]
        color:
          type: string
          nullable: true
          enum: [yellow, pink, blue, green, null]
          description: Highlight colour; always null for a note.
          example: "blue"
        start_line:
          type: integer
          description: poem_lines.line_number of the first line (1-based).
          example: 2
        start_word:
          type: integer
          description: 0-based word in start_line (inclusive), split like room.js wrapWords().
          example: 1
        end_line:
          type: integer
          example: 3
        end_word:
          type: integer
          description: 0-based word in end_line (inclusive).
          example: 0
        quote:
          type: string
          example: "the woods are lovely"
        content:
          type: string
          nullable: true
          description: >
            The note text; always null for a highlight. Notes copied from line
            annotations may be up to 1000 characters.
          example: "dark and deep"
        created_at:
          type: string
          example: "2026-11-11 09:00:00"

    RoomBookChapter:
      type: object
      properties:
        chapter:
          type: object
          properties:
            idx:
              type: integer
              example: 0
            title:
              type: string
              nullable: true
              example: "Chapter I."
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/BookParagraph'

paths:
  /api/public/poem:
    get:
      tags: [Public]
      summary: Get a single short poem for the landing page
      description: >
        Returns one short poem (4-12 lines) for the public, logged-out landing
        page so visitors can preview Typoem before signing up. No authentication
        required. A fresh poem is fetched live from PoetryDB (falling back to a
        local pool); this endpoint never reads or writes the database and assigns
        nothing to any room.
      responses:
        '200':
          description: A short poem
          content:
            application/json:
              schema:
                type: object
                properties:
                  poem:
                    $ref: '#/components/schemas/PublicPoem'
        '503':
          description: No poem available right now; client should retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, nickname, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  pattern: '^[a-zA-Z0-9_]+$'
                  example: jiseop
                nickname:
                  type: string
                  minLength: 2
                  maxLength: 20
                  example: Jiseop
                password:
                  type: string
                  minLength: 8
                  maxLength: 100
                  example: pw12345678
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: jiseop
                password:
                  type: string
                  example: pw12345678
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user, with the sign-up time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Users]
      summary: Change my nickname
      description: Same rules as register (2-20 characters, no whitespace). The username does not change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, minLength: 2, maxLength: 20, example: 앨리스 }
      responses:
        '200':
          description: Nickname changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { description: Nickname missing, too short / long, or has whitespace }
        '401': { description: Missing or invalid token }
        '404': { description: User not found }

    delete:
      tags: [Users]
      summary: Delete my account (회원 탈퇴)
      description: >
        Needs the password again. Deletes the account and everything that belongs to it:
        memos (and likes on them), likes, notes, marks, vocab, reading progress, streak and
        memberships. Rooms the user owns go to the member who joined earliest; a room
        with no other members is deleted. All or nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, example: password123 }
      responses:
        '204': { description: Account deleted }
        '400': { description: Password missing }
        '401': { description: Missing or invalid token }
        '403': { description: Wrong password (403, not 401, so the app does not log out) }
        '404': { description: User not found }
  /api/rooms:
    post:
      tags: [Rooms]
      summary: Create a new room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: "English Lit Study"
                description:
                  type: string
                  maxLength: 200
                  nullable: true
                  example: "Our daily poetry room"
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Room limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rooms/mine:
    get:
      tags: [Rooms]
      summary: List rooms the current user belongs to
      description: The room I opened last comes first (last_opened_at, any device), then rooms I never opened, newest first.
      security:
        - bearerAuth: []
      responses:
        '200':
